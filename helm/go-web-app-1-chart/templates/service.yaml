apiVersion: v1
kind: Service
metadata:
  name: go-web-app-1
  labels:
    app: go-web-app-1
spec:
  type: {{ .Values.service.type }}
  selector:
    app: go-web-app-1
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

