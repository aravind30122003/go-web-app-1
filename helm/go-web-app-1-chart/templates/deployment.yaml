apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-web-app-1
  labels:
    app: go-web-app-1
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: go-web-app-1
  template:
    metadata:
      labels:
        app: go-web-app-1
    spec:
      containers:
        - name: go-web-app-1
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.containerPort }}

