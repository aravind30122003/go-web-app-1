name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:

  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Dependencies
        run: go mod download

      - name: Build Application
        run: go build -o go-web-app-1

      - name: Run Unit Tests
        run: go test ./...

      - name: Run Go Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test-lint

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app-1:${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app-1:latest

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app-1:${{ github.run_id }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  update-helm-chart:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update Image Tag
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/go-web-app-1-chart/values.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.email "aravind30122003@gmail.com"
          git config --global user.name "aravind3012003"

          git add helm/go-web-app-1-chart/values.yaml

          git diff --cached --quiet || git commit -m "Update image tag to ${{ github.run_id }}"

          git push
